# GitLab CI/CD Pipeline for Aviation Safety Compliance System - Web Frontend
# Runs on merge requests to ensure code quality and tests pass

stages:
  - lint
  - test
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CACHE_COMPRESSION_LEVEL: "fastest"

cache:
  paths:
    - .npm/
    - node_modules/

# Lint stage - Check code quality
lint:eslint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint || true
  artifacts:
    reports:
      codequality: eslint-report.json
    expire_in: 1 week
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# Test stage - Run unit tests
test:unit:
  stage: test
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test -- --run --coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  only:
    - merge_requests
    - main
    - develop

# Build stage - Build the application
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Optional: Merge request approval stage
# This job will only pass if all previous stages succeeded
mr_approval:
  stage: build
  image: alpine:latest
  script:
    - echo "All checks passed! This MR is ready for review."
  dependencies: []
  needs:
    - lint:eslint
    - test:unit
    - build
  only:
    - merge_requests
