# GitLab CI/CD Pipeline for Aviation Safety Compliance System - Web Frontend
# Runs on merge requests to ensure code quality and tests pass

stages:
  - lint
  - test
  - build
  - publish
  - release

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CACHE_COMPRESSION_LEVEL: "fastest"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

cache:
  paths:
    - .npm/
    - node_modules/

# Lint stage - Check code quality. Blocking: a lint failure fails the pipeline.
lint:eslint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint:report
  artifacts:
    when: always
    reports:
      codequality: eslint-report.json
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Test stage - Run unit tests
test:unit:
  stage: test
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test -- --run --coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  only:
    - merge_requests
    - main
    - develop

# The documented pre-merge auth gate (see
# docs/auth/AUTH_CHUNK8_OPERATIONAL_READINESS.md)
# lists the consolidated auth suite and the session load probe. Neither ran in
# CI before.
test:auth:
  stage: test
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:auth:all
  only:
    - merge_requests
    - main
    - develop

load:auth:probe:
  stage: test
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run load:auth:probe
  only:
    - merge_requests
    - main
    - develop

# The server endpoint manifest (docs/endpoints.md) is derived from the routers
# and their mounts; this job fails when the two drift so the documented API
# surface can never silently go stale.
verify:endpoints:
  stage: test
  image: node:20-alpine
  script:
    - node scripts/verify-endpoints.mjs
  only:
    - merge_requests
    - main
    - develop

# Build stage - Build the application
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Optional: Merge request approval stage
# This job will only pass if all previous stages succeeded
mr_approval:
  stage: build
  image: alpine:latest
  script:
    - echo "All checks passed! This MR is ready for review."
  dependencies: []
  needs:
    - lint:eslint
    - test:unit
    - build
  only:
    - merge_requests

# Optional publish stage - builds and pushes backend/frontend images to GitLab Container Registry
# Requires CI_REGISTRY, CI_REGISTRY_USER, and CI_REGISTRY_PASSWORD (provided in GitLab CI by default)
# Controlled by PUBLISH_DOCKER_IMAGES=true to avoid changing current pipeline behavior.
publish:backend:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --target prod -f Dockerfile.backend -t "$BACKEND_IMAGE:$CI_COMMIT_SHA" -t "$BACKEND_IMAGE:latest" .
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: '$PUBLISH_DOCKER_IMAGES == "true" && $CI_REGISTRY && $CI_REGISTRY_USER && $CI_REGISTRY_PASSWORD && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
      when: on_success
    - when: never

# ---------------------------------------------------------------------------
# Supply-chain scanning (P3.2). No repository had any security scanning before
# this.
#
# Gate policy, chosen from measurement rather than aspiration:
#
#   CRITICAL -> blocking.   Measured across all six repos on 2026-09-26: zero.
#                           So this gate is green today and genuinely stops a
#                           regression, rather than being red on arrival.
#   HIGH     -> reported.   33 findings exist today (21 in compliance_web, 12
#                           in compliance_checklist), all with fixes available.
#                           Blocking on HIGH immediately would red every
#                           pipeline in those two repos and the gate would be
#                           switched off within a day -- which is worse than no
#                           gate, because a disabled gate still reads as
#                           protection. Clear the backlog, then raise the bar
#                           here to HIGH,CRITICAL.
#
# --ignore-unfixed: a CVE with no available fix is information, not an action.
# The scan is skipped on scheduled pipelines so a new CVE disclosure cannot
# turn an unrelated nightly run red.
# ---------------------------------------------------------------------------
security:scan:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths: [.trivycache]
  script:
    # Blocking: any fixable CRITICAL fails the pipeline.
    # --skip-dirs excludes generated and bind-mounted runtime trees, not source.
    # web-data/ in particular is the AtroCore application installed at container
    # bootstrap: it is gitignored, absent from a fresh checkout, and vendors its
    # own npm tree, so scanning it here reports upstream's dependencies as if
    # they were this repository's. (It is not clean: upstream currently vendors
    # a CRITICAL prototype-pollution advisory in swiper. That belongs in an
    # upstream report and in image scanning, not in a gate on tracked source.)
    - trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage --exit-code 1 .
    # Reporting: HIGH is printed and saved, but does not fail the job yet.
    - trivy fs --scanners vuln --severity HIGH --ignore-unfixed --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage --exit-code 0 --format table -o trivy-high.txt . || true
    - 'echo "--- HIGH findings (not blocking; see the policy comment in .gitlab-ci.yml) ---"'
    - cat trivy-high.txt || true
    # SBOM, always produced, never blocking. CycloneDX is the format the
    # release process will consume once images are published and signed.
    - trivy fs --format cyclonedx --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage -o sbom.cdx.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-high.txt
      - sbom.cdx.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Releases are CalVer-tagged from CHANGELOG.md and gated on a prepared release
# entry: the tag is the date of the newest "## [YYYY-MM-DD]" section, the
# pipeline fails when that section is missing, when CHANGELOG.md is unchanged
# since the previous release, or when the tag already exists. The CHANGELOG is
# the release trigger: a merge to the default branch that does not touch
# CHANGELOG.md produces no release. See scripts/release-tag.sh and
# CONTRIBUTING.md ("Versioning and releases").
compute_release_tag:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - sh scripts/release-tag.test.sh
    - sh scripts/release-tag.sh --env-file release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    ref: '$CI_COMMIT_SHA'
    description: 'See CHANGELOG.md for the changes in $RELEASE_TAG'

publish:frontend:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --target prod -f Dockerfile.frontend -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA" -t "$FRONTEND_IMAGE:latest" .
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: '$PUBLISH_DOCKER_IMAGES == "true" && $CI_REGISTRY && $CI_REGISTRY_USER && $CI_REGISTRY_PASSWORD && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
      when: on_success
    - when: never
