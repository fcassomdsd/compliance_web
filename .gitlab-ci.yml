# GitLab CI/CD Pipeline for Aviation Safety Compliance System - Web Frontend
# Runs on merge requests to ensure code quality and tests pass

stages:
  - lint
  - test
  - build
  - publish
  - release

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CACHE_COMPRESSION_LEVEL: "fastest"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

cache:
  paths:
    - .npm/
    - node_modules/

# Lint stage - Check code quality
lint:eslint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint || true
  artifacts:
    reports:
      codequality: eslint-report.json
    expire_in: 1 week
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# Test stage - Run unit tests
test:unit:
  stage: test
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test -- --run --coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  only:
    - merge_requests
    - main
    - develop

# Build stage - Build the application
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# Optional: Merge request approval stage
# This job will only pass if all previous stages succeeded
mr_approval:
  stage: build
  image: alpine:latest
  script:
    - echo "All checks passed! This MR is ready for review."
  dependencies: []
  needs:
    - lint:eslint
    - test:unit
    - build
  only:
    - merge_requests

# Optional publish stage - builds and pushes backend/frontend images to GitLab Container Registry
# Requires CI_REGISTRY, CI_REGISTRY_USER, and CI_REGISTRY_PASSWORD (provided in GitLab CI by default)
# Controlled by PUBLISH_DOCKER_IMAGES=true to avoid changing current pipeline behavior.
publish:backend:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --target prod -f Dockerfile.backend -t "$BACKEND_IMAGE:$CI_COMMIT_SHA" -t "$BACKEND_IMAGE:latest" .
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: '$PUBLISH_DOCKER_IMAGES == "true" && $CI_REGISTRY && $CI_REGISTRY_USER && $CI_REGISTRY_PASSWORD && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
      when: on_success
    - when: never

# Release stage - creates a GitLab Release tagged with the current date
# whenever a pipeline runs on main (i.e. on every merge to main).
compute_release_tag:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "RELEASE_TAG=$(date +%Y-%m-%d)" >> release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    description: "Release $RELEASE_TAG"
    ref: '$CI_COMMIT_SHA'

publish:frontend:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --target prod -f Dockerfile.frontend -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA" -t "$FRONTEND_IMAGE:latest" .
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: '$PUBLISH_DOCKER_IMAGES == "true" && $CI_REGISTRY && $CI_REGISTRY_USER && $CI_REGISTRY_PASSWORD && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
      when: on_success
    - when: never
