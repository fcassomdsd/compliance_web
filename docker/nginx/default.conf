# Plain-HTTP edge. This is what the demo, local development and any
# non-TLS deployment use.
#
# Listens on 8080 INSIDE the container, not 80. Two reasons, and both matter:
#
#   1. A port above 1024 can be bound without NET_BIND_SERVICE, so nginx runs
#      as the unprivileged `nginx` user with a read-only root filesystem --
#      the hardening P3.2 had to defer for this service.
#   2. The host mapping is what decides the externally visible port, and
#      publishing to host 8080 collided with compliance_cmis's Traefik, which
#      owns that port for Alfresco and is wired into the demo, the runbook and
#      every smoke probe. Traefik keeps 8080; this service moved.
#
# See tls.conf for the production server. Routing and security headers are
# shared via app.conf.inc so the two cannot drift.
server {
  listen 8080;
  server_name _;

  include /etc/nginx/conf.d/app.conf.inc;
}
