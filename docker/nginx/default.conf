server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin access to Node-RED so the browser never needs a Node-RED host or
  # API key. The Docker embedded DNS resolver is used with a variable upstream so
  # nginx still starts when node-red is not on the network.
  location /nodered/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $node_red_upstream "http://node-red:1880";
    rewrite ^/nodered/(.*)$ /$1 break;
    proxy_pass $node_red_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}