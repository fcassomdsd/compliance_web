# TLS edge (production).
#
# Listens on 8443 inside the container so nginx can run unprivileged; the host
# publishes 443 to it. Certificates are mounted at /etc/nginx/certs and are
# deployment-specific -- scripts/generate-dev-cert.sh produces a self-signed
# pair for verifying this configuration locally, which is NOT for production
# use. For a real deployment use an enterprise CA, or the Let's Encrypt/ACME
# configuration already written at atrocore-docker/traefik/traefik.yml.example.
#
# Routing and security headers are shared with the plain-HTTP server via
# app.conf.inc, so a route added in one is present in the other.

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # TLS 1.2 is retained because the platform's own production plan commits to
  # "TLS 1.2+"; drop to 1.3-only once no client needs it.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS is set ONLY here, never on the plain-HTTP server: sending it over
  # HTTP is meaningless, and sending it from a demo stack would pin a
  # developer's browser to HTTPS for a host that does not serve it.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  include /etc/nginx/conf.d/app.conf.inc;
}
