name: CI

# Mirror of this repository's GitLab CI validation jobs, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal jobs are mirrored here; build/publish/release automation stays
# GitLab-only.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint:report

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test -- --run --coverage

  test-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:auth:all

  verify-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # The server endpoint manifest (docs/endpoints.md) is derived from the routers and their
      # mounts; this job fails when the two drift so the documented API surface can never
      # silently go stale.
      - run: node scripts/verify-endpoints.mjs

  security-scan:
    # Supply-chain scanning (P3.2). Gate policy chosen from measurement:
    # CRITICAL is blocking (measured at zero across all six repos, so the gate
    # is green today and stops regressions); HIGH is reported but not blocking
    # while 33 known-fixable findings are cleared, because a gate that is red
    # on arrival gets switched off, and a disabled gate still reads as
    # protection. --skip-dirs excludes generated/bind-mounted runtime trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '1'
      - name: Report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '0'
