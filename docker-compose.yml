name: compliance-web

services:
  db:
    image: postgres:16-alpine
    container_name: compliance-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance} -d ${POSTGRES_DB:-compliance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Applies migrations/*.sql before the backend starts. Replaces the previous
  # docker-entrypoint-initdb.d mount, which only ran on a brand-new volume and
  # only supplied the auth schema — the CAP-draft and notification tables were
  # missing on a fresh database.
  migrate:
    image: compliance-web-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: ${BACKEND_BUILD_TARGET:-dev}
    container_name: compliance-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance}
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: compliance-web-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: ${BACKEND_BUILD_TARGET:-dev}
    container_name: compliance-backend
    environment:
      AUTH_SERVER_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance}
      ALFRESCO_BASE_URL: ${ALFRESCO_BASE_URL:-http://proxy:8080}
      NODE_RED_BASE_URL: ${NODE_RED_BASE_URL:-http://node-red:1880}
      # Shared secret for Node-RED's X-API-Key gateway guard (see compliance_flow).
      NODE_RED_API_KEY: ${NODE_RED_API_KEY:-}
      # No fallback: a committed default key would silently encrypt every session
      # ticket with a value that is public knowledge.
      AUTH_TICKET_ENCRYPTION_KEY: ${AUTH_TICKET_ENCRYPTION_KEY:?AUTH_TICKET_ENCRYPTION_KEY must be set}
      # Secure by default. Local HTTP development must opt out explicitly.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NODE_ENV: ${AUTH_NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: compliance-frontend-dev
    environment:
      VITE_AUTH_API_BASE_URL: /api/auth
      VITE_AUTH_PROXY_TARGET: http://backend:4000
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: in this image `localhost` resolves to `::1` first
      # (busybox wget tries it before IPv4) while Vite binds only 0.0.0.0:3000, so the
      # check failed with "connection refused" and `docker compose ps` reported the UI
      # `unhealthy` on a perfectly working demo — which is the first thing a newcomer
      # looks at. Verified: `wget --spider http://localhost:3000` exits 1 inside the
      # container, `http://127.0.0.1:3000` exits 0.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - backend
    # The Vite dev server proxies /nodered to VITE_NODE_RED_PROXY_TARGET
    # (docker-compose.dev.yml); the container must share a network with
    # compliance_flow/node-red for that name to resolve.
    networks:
      - default
      - alfresco_backend

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        VITE_AUTH_API_BASE_URL: /api/auth
        VITE_NODE_RED_BASE_URL: /nodered
    container_name: compliance-frontend-prod
    ports:
      - "8080:80"
    healthcheck:
      # Same IPv6-first `localhost` trap as frontend-dev: probe the IPv4 address nginx binds.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - backend
    # nginx proxies /nodered/ to http://node-red:1880 (docker/nginx/default.conf),
    # so the production frontend needs the same shared network as the backend.
    networks:
      - default
      - alfresco_backend

volumes:
  pgdata:

networks:
  alfresco_backend:
    name: alfresco_backend
    external: true
