name: compliance-web

services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    # Deliberately NOT read_only and NOT cap_drop: ALL. The official Postgres
    # image needs to chown its data directory and drop privileges to the
    # postgres user at startup, which requires CHOWN/SETUID/SETGID/FOWNER, and
    # it writes to /var/run/postgresql and /tmp. no-new-privileges and resource
    # limits are the controls that apply cleanly here.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    container_name: compliance-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance} -d ${POSTGRES_DB:-compliance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Applies migrations/*.sql before the backend starts. Replaces the previous
  # docker-entrypoint-initdb.d mount, which only ran on a brand-new volume and
  # only supplied the auth schema — the CAP-draft and notification tables were
  # missing on a fresh database.
  migrate:
    image: compliance-web-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: ${BACKEND_BUILD_TARGET:-dev}
    container_name: compliance-migrate
    # Runs once and exits, but it holds the database credential while it does,
    # so it gets the same treatment as the backend it shares an image with.
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance}
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: compliance-web-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: ${BACKEND_BUILD_TARGET:-dev}
    container_name: compliance-backend
    restart: unless-stopped
    # Container hardening (P3.2). The app writes nothing to its own filesystem
    # -- dependencies are installed at build time and all state is in Postgres
    # -- so the root filesystem is immutable and it runs as the image's
    # non-root `node` user. /tmp is a small tmpfs for anything transient.
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      AUTH_SERVER_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance}
      ALFRESCO_BASE_URL: ${ALFRESCO_BASE_URL:-http://proxy:8080}
      NODE_RED_BASE_URL: ${NODE_RED_BASE_URL:-http://node-red:1880}
      # Shared secret for Node-RED's X-API-Key gateway guard (see compliance_flow).
      NODE_RED_API_KEY: ${NODE_RED_API_KEY:-}
      # No fallback: a committed default key would silently encrypt every session
      # ticket with a value that is public knowledge.
      AUTH_TICKET_ENCRYPTION_KEY: ${AUTH_TICKET_ENCRYPTION_KEY:?AUTH_TICKET_ENCRYPTION_KEY must be set}
      # Secure by default. Local HTTP development must opt out explicitly.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NODE_ENV: ${AUTH_NODE_ENV:-production}
      # Service account for the scheduled jobs and for role-addressed
      # notifications, which read Alfresco group membership to find who holds a
      # role. Without it both jobs log "skipped" at startup and every role
      # notification falls back to the fixed addresses below. It needs to read
      # groups and people, which an ordinary (non-administrator) Alfresco
      # account can do.
      ALFRESCO_JOB_USERNAME: ${ALFRESCO_JOB_USERNAME:-}
      ALFRESCO_JOB_PASSWORD: ${ALFRESCO_JOB_PASSWORD:-}
      # How long the role -> users lookup is cached, in ms (default 15 minutes).
      ROLE_RECIPIENT_CACHE_MS: ${ROLE_RECIPIENT_CACHE_MS:-}
      # Hour of the day each daily job runs, as a plain integer 0-23, in the
      # container's timezone — UTC unless the image is given another one.
      # Defaults: 1 and 2. Left empty, the defaults apply.
      #
      # The scheduler rolls forward, never back: if the hour has already passed
      # when the process starts, the first run is that hour *tomorrow*. So to
      # make a job run soon, pick an hour still ahead of the container clock
      # (`docker compose exec backend date -u`) and restart the service.
      FINDING_OVERDUE_JOB_HOUR: ${FINDING_OVERDUE_JOB_HOUR:-}
      SITE_VISIT_SCHEDULING_JOB_HOUR: ${SITE_VISIT_SCHEDULING_JOB_HOUR:-}
      # Days of planning notice a recurring cadence gets before its due date,
      # when the cadence itself names none (InspectionCadence.planningLeadDays).
      # Default 20.
      SITE_VISIT_PLANNING_LEAD_DAYS: ${SITE_VISIT_PLANNING_LEAD_DAYS:-}
      # Email delivery. Without SMTP_HOST the transport is not configured and
      # email notifications queue and fail; the in-app notifications a role
      # notification also creates are unaffected, since they need no transport.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Fallback addresses for role-addressed notifications, used when a role
      # resolves to nobody, the lookup fails, or no service account is set.
      # CASE_ESCALATION_EMAIL has no role behind it by design — the BPMN routes a
      # missed deadline to a safety-case team that is not one of the app's roles.
      INSPECTOR_NOTIFICATIONS_EMAIL: ${INSPECTOR_NOTIFICATIONS_EMAIL:-}
      CAP_ENTRY_NOTIFICATIONS_EMAIL: ${CAP_ENTRY_NOTIFICATIONS_EMAIL:-}
      PLANNER_NOTIFICATIONS_EMAIL: ${PLANNER_NOTIFICATIONS_EMAIL:-}
      CASE_ESCALATION_EMAIL: ${CASE_ESCALATION_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: compliance-frontend-dev
    environment:
      VITE_AUTH_API_BASE_URL: /api/auth
      VITE_AUTH_PROXY_TARGET: http://backend:4000
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: in this image `localhost` resolves to `::1` first
      # (busybox wget tries it before IPv4) while Vite binds only 0.0.0.0:3000, so the
      # check failed with "connection refused" and `docker compose ps` reported the UI
      # `unhealthy` on a perfectly working demo — which is the first thing a newcomer
      # looks at. Verified: `wget --spider http://localhost:3000` exits 1 inside the
      # container, `http://127.0.0.1:3000` exits 0.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - backend
    # The Vite dev server proxies /nodered to VITE_NODE_RED_PROXY_TARGET
    # (docker-compose.dev.yml); the container must share a network with
    # compliance_flow/node-red for that name to resolve.
    networks:
      - default
      - alfresco_backend

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        VITE_AUTH_API_BASE_URL: /api/auth
        VITE_NODE_RED_BASE_URL: /nodered
    container_name: compliance-frontend-prod
    restart: unless-stopped
    # Container hardening (P3.2), partial by design. nginx's master process
    # needs NET_BIND_SERVICE to listen on :80 and CHOWN/SETUID/SETGID to drop
    # its workers to the nginx user, so cap_drop: ALL plus those four is the
    # correct shape rather than dropping everything. read_only and a non-root
    # `user:` are deferred to P3.3, which reworks this service into the TLS
    # edge and changes its listen port anyway -- hardening it twice would be
    # wasted work, and the 8080 collision with compliance_cmis's Traefik has
    # to be resolved in the same change.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "8080:80"
    healthcheck:
      # Same IPv6-first `localhost` trap as frontend-dev: probe the IPv4 address nginx binds.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - backend
    # nginx proxies /nodered/ to http://node-red:1880 (docker/nginx/default.conf),
    # so the production frontend needs the same shared network as the backend.
    networks:
      - default
      - alfresco_backend

volumes:
  pgdata:

networks:
  alfresco_backend:
    name: alfresco_backend
    external: true
