name: compliance-web

services:
  db:
    image: postgres:16-alpine
    container_name: compliance-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance} -d ${POSTGRES_DB:-compliance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./AUTH_CHUNK1_SQL_DRAFT.sql:/docker-entrypoint-initdb.d/001-auth-schema.sql:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: ${BACKEND_BUILD_TARGET:-dev}
    container_name: compliance-backend
    environment:
      AUTH_SERVER_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance}
      ALFRESCO_BASE_URL: ${ALFRESCO_BASE_URL:-http://proxy:8080}
      AUTH_TICKET_ENCRYPTION_KEY: ${AUTH_TICKET_ENCRYPTION_KEY:-dev-only-ticket-encryption-key-change-me}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      NODE_ENV: ${AUTH_NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: compliance-frontend-dev
    environment:
      VITE_AUTH_API_BASE_URL: /api/auth
      VITE_AUTH_PROXY_TARGET: http://backend:4000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - backend

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        VITE_AUTH_API_BASE_URL: /api/auth
    container_name: compliance-frontend-prod
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - backend

volumes:
  pgdata:
