services:
  db:
    ports:
      - "5433:5432"

  # The app server owns /nodered now: the browser (and the Vite dev server) send
  # the gateway prefix here, where the Node-RED API key, the session's own
  # Alfresco ticket and the specialty-scope check live. The backend therefore has
  # to reach node-red, which is on the external alfresco_backend network.
  #
  # This used to be a `frontend-dev` override setting VITE_NODE_RED_PROXY_TARGET,
  # because Vite proxied /nodered straight to node-red. Vite now proxies it to
  # the app server (`NODE_RED_BASE_URL` comes from docker-compose.yml), so that
  # override is gone.
  backend:
    ports:
      - "4000:4000"
    environment:
      ALFRESCO_BASE_URL: ${ALFRESCO_BASE_URL:-http://proxy:8080}
    networks:
      - default
      - alfresco_backend

networks:
  alfresco_backend:
    name: alfresco_backend
    external: true